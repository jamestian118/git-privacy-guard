[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "git-privacy-guard"
version = "0.1.0"
description = "Bootstrap privacy guard git hooks for repositories"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Zhuanz" }
]
keywords = ["git", "privacy", "gitleaks", "hooks", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Security"
]
dependencies = []

[project.scripts]
git-privacy-guard = "git_privacy_guard:cli"

[tool.setuptools]
py-modules = ["git_privacy_guard"]
